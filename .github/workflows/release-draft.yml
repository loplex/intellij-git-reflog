name: Release draft

# A tag is what starts a release. What it produces is a draft, carrying the signed archive that will be
# published: accepting the draft is a decision taken with the file in hand, having been able to install it.
#
# Called by Prepare release as well as triggered by a tag pushed by hand. It has to be callable: a tag pushed by
# a workflow using the token GitHub hands it sets off no workflow of its own, which is GitHub's guard against a
# workflow triggering itself round in a circle.
on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: The tag to build. Only for a call; a push takes the tag it was triggered by.
        required: true
        type: string

permissions:
  contents: write

jobs:
  draft:
    name: Build, sign and draft the release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The tag names the release; gradle.properties names what goes inside it. A release whose two disagree
      # would be found only by whoever installed it, so it is refused here instead.
      - name: Refuse a tag that disagrees with gradle.properties
        run: |
          tag="${TAG#v}"
          version="$(sed -n 's/^version=//p' gradle.properties)"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag ${TAG} says ${tag}, gradle.properties says ${version}"
            exit 1
          fi

      - run: ./gradlew check

      - name: Build and sign
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew signPlugin

      # The same section of CHANGELOG.md that the plugin's own change notes are built from, so the release page
      # and the Marketplace listing say one thing.
      - name: Take the release notes out of the changelog
        run: |
          ./gradlew getChangelog \
            --project-version="${TAG#v}" \
            --no-header --no-summary \
            --output-file=release-notes.md

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${TAG}" \
            --draft \
            --title "${TAG}" \
            --notes-file release-notes.md \
            build/distributions/*-signed.zip
