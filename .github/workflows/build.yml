name: Build

# `branches` keeps this off tags: publishing a release creates its tag, and an unfiltered push trigger would run
# for it too. `workflow_dispatch` is how the release asks for this once it has landed on main, a push made with
# GITHUB_TOKEN starting no run of its own.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Neither Java nor Gradle: these read Markdown, the tags and the working tree, and answer in seconds.
  checks:
    name: Check the documents and the release rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The released sections are compared against the tags that released them, and a shallow checkout has
          # neither those tags nor the history ancestry reads: every rule would pass having compared nothing.
          fetch-depth: 0

      # The Python the scripts under .github/scripts/ are run with, declared once in .python-version rather than
      # left to the runner's own python3, which is somebody else's choice and moves without notice: the scripts
      # use `X | None` annotations, which need 3.10, so an older default turns them into errors that say nothing
      # about the scripts.
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - run: .github/scripts/check-doc-links.py

      - run: python3 -m unittest discover -s .github/scripts

      # The release rules, asked of loplex/release-ci rather than of a copy kept here, pinned to a release tag as
      # its README asks of every caller:
      #
      # - version: whether the version gradle.properties names may be released after what is tagged, so that a
      #   version no release could be cut from is red here rather than in the release run;
      # - changelog: whether every released section still reads as its tag has it. It is the release notes on
      #   GitHub and the change notes on the Marketplace both, and a three-way merge can put an entry added to
      #   [Unreleased] into a released section, cleanly, because Git cannot see that a heading is a container;
      # - ancestry: whether every released tag is still reachable. A squash merge, a rebase merge, `Update with
      #   rebase` or a force-push leaves a tag naming a commit no branch reaches, and asking the property holds
      #   for every way GitHub adds of doing that.
      - uses: loplex/release-ci/check-release@v0.2.0
        with:
          source: gradle.properties
          checks: version changelog ancestry

      # The README states which plugin on JetBrains Marketplace this repository is, as a numeric id repeated
      # across two badges, the links around them and the link to the plugin page. Nothing ties that number to
      # the xmlId the plugin actually publishes under, so this asks only what can be asked offline: that every
      # occurrence agrees.
      - run: .github/scripts/check-readme.py marketplace

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      # Caches ~/.gradle only. The project's own .gradle/ is left alone deliberately: a cached configuration
      # cache entry has been seen to fail instrumentTestCode on a build that ran green without one.
      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew check

      - name: Keep the reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/

  verify:
    name: Verify against the IDEs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # A job of its own because it downloads an IDE per version verified, which is minutes and gigabytes the
      # test job has no reason to wait for.
      - run: ./gradlew verifyPlugin

      - name: Keep the verification report of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verifier-report
          path: build/reports/pluginVerifier/
