name: Prepare release

# Cuts a release from what the repository already says. There is nothing to type: `gradle.properties` names the
# version being worked on, marked -SNAPSHOT, and dropping that marker is what a release is.
#
# Nothing reaches `main` here. The release commit goes onto a branch of its own and the draft is built from it,
# so a draft that is thrown away leaves the default branch as it was - no commit to revert and no tag to delete.
# What it does leave, the branch and the draft, the next run for the same version replaces. The branch is
# carried back by Publish, once the release has been accepted.
#
# Each step is an action of loplex/release-ci, pinned to a release tag as its README asks of every caller; what
# each one checks and refuses is said in its action.yml.
on:
  workflow_dispatch:

# One at a time. Two runs would race for the same release branch and the same draft, and the version check
# answers for the tags as they stood when it looked.
concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Check, build, sign and draft the release
    # A dispatch can be started on any branch and would cut the release from that one, which is what the
    # merge-back would then carry onto main unreviewed.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    # For pushing the release branch and drafting the release; nothing before the draft writes to the remote.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The version check reads every tag to answer what may follow what.
          fetch-depth: 0

      # The release rules - version, changelog, ancestry - then [Unreleased] closed into a dated section, the
      # version written into gradle.properties without its marker, and the one commit left on release/<version>.
      # Nothing is pushed yet: a build that fails below leaves neither a branch nor a draft behind.
      - uses: loplex/release-ci/release-flow/prepare@v0.2.0
        id: cut
        with:
          source: gradle.properties
          repository-url: ${{ github.server_url }}/${{ github.repository }}

      # `check`, the Plugin Verifier and `signPlugin`, all over the release commit itself: it lives on a branch
      # Build does not see before the release is published, so nothing else ties the release to a run that was
      # green. The verifier downloads an IDE for every release it checks against, which the runner's disk does
      # not hold beside what it ships with, hence the room made first.
      - uses: loplex/release-ci/intellij/build@v0.2.0
        id: built
        with:
          free-disk-space: 'true'
          certificate-chain: ${{ secrets.CERTIFICATE_CHAIN }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          private-key-password: ${{ secrets.PRIVATE_KEY_PASSWORD }}

      # A draft carrying the signed archive that will be published: accepting it is a decision taken with the
      # file in hand, having been able to install it. The tag is named but not created - GitHub creates it when
      # the draft is published - so a draft thrown away leaves no tag behind. A version with a pre-release
      # suffix is marked as one, so that GitHub does not hold it out as the latest release.
      - uses: loplex/release-ci/release-flow/draft@v0.2.0
        with:
          source: gradle.properties
          version: ${{ steps.cut.outputs.version }}
          tag: ${{ steps.cut.outputs.tag }}
          branch: ${{ steps.cut.outputs.branch }}
          files: ${{ steps.built.outputs.archive }}
