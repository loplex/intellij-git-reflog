group=cz.loplex
# The version being worked on, marked so that it cannot be mistaken for one that has
# been released. Dropping the marker is what a release is: `prepare-release` reads the
# version off this line, commits it without the marker, and builds the release from that
# commit. Nothing has to be typed at release time, and nothing can be typed wrong.
# A pre-release is worked on as `0.2.0-beta.1-SNAPSHOT`: released, it goes to the Marketplace
# channel `beta` and is marked a pre-release on GitHub (the channel rule is release-ci's check-release,
# https://github.com/loplex/release-ci/blob/v0.2.0/README.md#check-release).
version=0.1.1-SNAPSHOT

# What a release tag is called in front of the version. `v0.1.0` is how this project's
# releases are tagged, and what the changelog plugin generates links against. Declared
# rather than assumed, because the release tooling is shared with projects that tag bare
# versions and refuses to guess which of the two it is looking at.
tagPrefix=v

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency=false
# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true
# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true
